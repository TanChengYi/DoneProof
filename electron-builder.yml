appId: com.doneproof.desktop
productName: DoneProof
directories:
  output: release
files:
  - out/**/*
  - package.json
asar: true
win:
  target:
    - nsis
    - portable
  artifactName: ${productName}-${version}-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
